<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .avatar {
            width: 80px;
            height: 80px;
            background: #38bdf8;
            color: #0f172a;
            font-size: 36px;
            font-weight: bold;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
        }
        h1 {
            font-size: 28px;
            color: #38bdf8;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }
        p {
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 30px;
        }
        .btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background: #7dd3fc;
            transform: translateY(-2px);
        }
        .counter-box {
            margin-top: 25px;
            padding: 12px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 8px;
            font-size: 14px;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">I</div>
        <h1>Hi, I'm Ignacy</h1>
        <p class="subtitle">IT Student @ Warsaw University of Technology</p>
        
        <p>Press for a surprise</p>

        <button class="btn" id="clickBtn">surprise button</button>

        <div class="counter-box">
            counter: <span id="counter">0</span>
        </div>
    </div>

    <script>
        let count = 0;
        const btn = document.getElementById('clickBtn');
        const counterSpan = document.getElementById('counter');

        btn.addEventListener('click', () => {
            count++;

            if (count === 25) {
                counterSpan.textContent = '🎁';
                count = 0;

                setTimeout(() => {
                    counterSpan.textContent = count;
                }, 1000);
            } else {
                counterSpan.textContent = count;
            }
        });
    </script>
</body>
</html>
